<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vantera TMS - offline</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1116; color: #d7d5cf; }
  .card { max-width: 380px; padding: 32px; text-align: center; }
  img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #94928b; line-height: 1.5; margin: 0 0 20px; }
  button { background: #7aacf6; color: #0f1116; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>No internet connection</h1>
    <p>Vantera TMS needs the internet to show live loads. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
