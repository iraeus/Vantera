<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Vantera TMS</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0f1116; color:#d7d5cf; font-family: "Segoe UI", system-ui, sans-serif; text-align:center; }
  .card { max-width:380px; padding:28px; } img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:16px 0 8px; } p { color:#94928b; font-size:14px; line-height:1.5; margin:0 0 18px; }
  button { padding:12px 22px; border:0; border-radius:10px; background:#7aacf6; color:#0f1116; font-weight:600; font-size:15px; cursor:pointer; margin:0 4px; }
  button.alt { background:#272729; color:#d7d5cf; border:1px solid #36363b; }
</style></head>
<body><div class="card">
  <img src="build/icon.png" alt="" />
  <h1>Can't reach Vantera</h1>
  <p>Check your internet connection. If the website address changed, you can type the new one.</p>
  <button onclick="window.vantera.retry()">Try again</button>
  <button class="alt" onclick="window.vantera.changeUrl()">Change address</button>
</div></body></html>
