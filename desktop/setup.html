<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Vantera TMS</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0f1116; color:#d7d5cf; font-family: "Segoe UI", system-ui, sans-serif; }
  .card { width:420px; max-width:90vw; background:#212122; border:1px solid #36363b; border-radius:16px; padding:28px; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:16px 0 6px; } p { color:#94928b; font-size:14px; line-height:1.5; margin:0 0 16px; }
  input { width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid #36363b; background:#1a1a1a; color:#d7d5cf; font-size:15px; }
  button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:10px; background:#7aacf6; color:#0f1116; font-weight:600; font-size:15px; cursor:pointer; }
  #err { color:#fd6d6f; font-size:13px; margin-top:10px; min-height:18px; }
</style></head>
<body><div class="card">
  <img src="build/icon.png" alt="" />
  <h1>Welcome to Vantera TMS</h1>
  <p>Type the address of your Vantera website, for example <b>my-company.netlify.app</b>. You only do this once.</p>
  <input id="url" placeholder="my-company.netlify.app" autofocus />
  <div id="err"></div>
  <button id="go">Open Vantera</button>
</div>
<script>
  const go = async () => {
    const r = await window.vantera.saveUrl(document.getElementById("url").value);
    if (!r.ok) document.getElementById("err").textContent = r.error;
  };
  document.getElementById("go").onclick = go;
  document.getElementById("url").onkeydown = (e) => { if (e.key === "Enter") go(); };
</script></body></html>
